name: Security Audit & Automated Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run every Monday at midnight UTC
    - cron: '0 0 * * 1'

jobs:
  audit-and-test:
    name: Security Vulnerability Scan & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm security audit
        run: npm audit --audit-level=high

      - name: Run test suite
        run: npm test

      - name: Validate production build
        run: npm run build

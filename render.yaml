services:
  - type: web
    name: zcross
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_MOONPAY_API_KEY
        value: pk_test_QuRBVUBMr6EnuDz228i91makUVHM6K5T
